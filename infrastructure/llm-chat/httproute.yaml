# Route for llm-chat's web frontend; the llm-chat chart has no HTTPRoute
# template. Deployed by the llm-chat-web Application (clusters/homelab/llm-chat.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - llm-chat.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web   # Service of the "web" release
          port: 80
