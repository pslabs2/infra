# Traefik — replaces the one k3s would have bundled. Serves the shared Gateway
# (traefik/traefik-gateway) that every HTTPRoute attaches to. The Ingress
# provider stays on so Ingresses keep working, e.g. from charts/app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.4.0
    helm:
      valuesObject:
        # LoadBalancer on 80/443 is picked up by k3s ServiceLB, which the
        # k3d load balancer forwards to from host ports 8080/8443.
        service:
          spec:
            type: LoadBalancer
        ingressClass:
          enabled: true
          isDefaultClass: true
        # Needs the CRDs from clusters/homelab/gateway-api.yaml.
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          listeners:
            web:
              port: 8000      # the "web" entrypoint behind Service port 80
              protocol: HTTP
              namespacePolicy:
                from: All     # routes live in each app's namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:   # until the Gateway API CRDs exist
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
