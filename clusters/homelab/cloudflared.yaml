# Cloudflare Tunnel connector. Plain manifests live in infrastructure/cloudflared/.
# The tunnel token Secret is created by cloudflared.sh, not stored in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/pslabs2/infra
    targetRevision: main
    path: infrastructure/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
