apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-chat-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pslabs2/llm-chat
    targetRevision: main
    path: charts/api
    helm:
      releaseName: api
      valuesObject:
        fullnameOverride: api
        gemini:
          existingSecret: llm-chat-api
        extraEnv:
          - name: APP_ENV
            value: production
          # Voice input through the shared speaches server (clusters/homelab/whisper.yaml).
          # STT_MODEL must be listed in that server's MODELS.
          - name: STT_URL
            value: http://whisper.whisper.svc.cluster.local:8000
          - name: STT_MODEL
            value: Systran/faster-distil-whisper-small.en
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-chat-web
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/pslabs2/llm-chat
      targetRevision: main
      path: charts/web
      helm:
        releaseName: web
        valuesObject:
          fullnameOverride: web
          apiUpstream: http://api.llm-chat.svc.cluster.local:8000
    # HTTPRoute for llm-chat.localhost
    - repoURL: https://github.com/pslabs2/infra
      targetRevision: main
      path: infrastructure/llm-chat
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:   # until the Gateway API CRDs exist
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
