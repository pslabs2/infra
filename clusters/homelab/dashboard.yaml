apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/pslabs2/Dashboard
    targetRevision: v0.1.0
    path: deploy/helm/homelab-dashboard
    helm:
      valuesObject:
        httpRoute:
          enabled: true
          parentRefs:
            - name: traefik-gateway
              namespace: traefik
              sectionName: web
          hostnames:
            - dashboard.pukarsubedi.com
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:   # until the Gateway API CRDs exist
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
