apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/pslabs2/Dashboard
    targetRevision: v0.1.0
    path: deploy/helm/homelab-dashboard
    helm:
      valuesObject:
        # Dashboard exposes cluster state without authentication by default.
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
