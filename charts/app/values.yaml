# Generic application chart. Every entry under `components` becomes a Deployment, a
# Service and (optionally) an HTTPRoute or an Ingress. Resources are named after the component
# (component "backend" creates Service "backend"), so deploy one app per namespace.
#
# Per-app values live in apps/<app>/values.yaml and are created by the
# pslabs2/workflows onboard-app workflow.

# Value of the app.kubernetes.io/part-of label. Defaults to the release name.
nameOverride: ""

imagePullSecrets: []

# Defaults for every component. A component that sets one of these keys replaces
# the default entirely (no deep merge), so `securityContext: {}` really is empty.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Each path gets an emptyDir, because the root filesystem is read-only.
writablePaths:
  - /tmp

# Default Gateway for component routes: Traefik's shared Gateway.
gateway:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web

# Prefer `route`; Ingress stays supported for apps that still set `ingress`.
ingress:
  className: traefik

components: {}
