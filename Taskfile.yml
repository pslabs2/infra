# https://taskfile.dev

version: "3"

vars:
  # Change these if your scripts are named differently (e.g. 2-argocd.sh).
  CLUSTER_SCRIPT: ./cluster.sh
  ARGOCD_SCRIPT: ./argocd.sh
  CLOUDFLARED_SCRIPT: ./cloudflared.sh

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  up:
    desc: Create the cluster and bring everything up, ending with a check of the public URL
    cmds:
      - task: cluster
      - task: tunnel-secret
      - task: argocd
      - task: wait
      - task: verify

  down:
    desc: Delete the cluster
    cmds:
      - "{{.CLUSTER_SCRIPT}} delete"

  recreate:
    desc: Delete everything and bring it back up
    cmds:
      - task: down
      - task: up

  cluster:
    desc: Create the k3d cluster
    cmds:
      - "{{.CLUSTER_SCRIPT}} create"

  tunnel-secret:
    desc: Create the Cloudflare tunnel token Secret
    cmds:
      - "{{.CLOUDFLARED_SCRIPT}} secret"

  argocd:
    desc: Install ArgoCD and the root Application
    cmds:
      - "{{.ARGOCD_SCRIPT}} install"

  wait:
    desc: Wait until every ArgoCD Application is Synced and Healthy
    cmds:
      - "{{.ARGOCD_SCRIPT}} wait"

  verify:
    desc: Check the public ArgoCD URL answers through the tunnel
    cmds:
      - "{{.CLOUDFLARED_SCRIPT}} verify"

  status:
    desc: Show ArgoCD pods and Applications
    cmds:
      - "{{.ARGOCD_SCRIPT}} status"