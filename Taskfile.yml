version: "3"

vars:
  CLUSTER_SCRIPT: "{{.TASKFILE_DIR}}/cluster.sh"
  ARGOCD_SCRIPT: "{{.TASKFILE_DIR}}/argocd.sh"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  up:
    desc: Bootstrap the GitOps platform
    cmds:
      - task: cluster
      - task: argocd
      - task: wait
      - task: show

  down:
    desc: Delete the cluster
    cmds:
      - bash "{{.CLUSTER_SCRIPT}}" delete

  recreate:
    desc: Recreate the entire platform
    cmds:
      - task: down
      - task: up

  cluster:
    desc: Create the k3d cluster
    cmds:
      - bash "{{.CLUSTER_SCRIPT}}" create

  argocd:
    desc: Install Argo CD
    cmds:
      - bash "{{.ARGOCD_SCRIPT}}" install

  wait:
    desc: Wait for Argo CD Applications
    cmds:
      - bash "{{.ARGOCD_SCRIPT}}" wait

  show:
    desc: Show Argo CD status and login
    cmds:
      - bash "{{.ARGOCD_SCRIPT}}" show

  status:
    desc: Show Argo CD status
    cmds:
      - bash "{{.ARGOCD_SCRIPT}}" status

  login:
    desc: Show Argo CD login instructions
    cmds:
      - bash "{{.ARGOCD_SCRIPT}}" instructions